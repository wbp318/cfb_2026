# Weekly grouped PRs for GitHub Actions. Python deps get security updates only:
# open-pull-requests-limit: 0 disables version bumps (floor-raising PRs) but
# Dependabot still opens a PR for any advisory that affects a pinned dependency.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
